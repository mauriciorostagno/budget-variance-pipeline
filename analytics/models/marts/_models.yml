version: 2

models:
  - name: dim_cost_centers
    description: >
      Cost center dimension. One row per cost center, plus an Unknown member
      (key -1) for invoices whose cost center is missing from the source.
    columns:
      - name: cost_center_key
        description: Primary key. -1 is the Unknown member.
        data_tests:
          - unique
          - not_null
      - name: cost_center_name
        description: Cost center name as shown in reports.
      - name: area
        description: Business area the cost center belongs to.
      - name: owner
        description: Person accountable for the cost center budget.

  - name: dim_vendors
    description: >
      Vendor dimension. One row per vendor. No Unknown member: every invoice
      references a vendor that exists in the source.
    columns:
      - name: vendor_key
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: vendor_name
        description: Vendor legal name.
      - name: vendor_type
        description: Vendor classification, such as supplier or contractor.
      - name: country
        description: Country the vendor invoices from.

  - name: fct_invoices
    description: >
      One row per invoice, converted to USD at the exchange rate of its issue
      date. Credit notes are kept as negative amounts, so sum(amount_usd) is
      net spend and filtering on transaction_type gives gross spend.
    columns:
      - name: invoice_id
        description: Primary key. One row per invoice after deduplication.
        data_tests:
          - unique
          - not_null
      - name: vendor_key
        description: Foreign key to dim_vendors.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendors')
                field: vendor_key
              config:
                severity: error
      - name: cost_center_key
        description: Foreign key to dim_cost_centers. -1 when unmapped.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cost_centers')
                field: cost_center_key
              config:
                severity: error
      - name: issue_date
        description: Business date the invoice was issued. Drives FX conversion.
        data_tests:
          - not_null
      - name: due_date
        description: Payment due date. Occasionally earlier than issue_date in the source.
      - name: budget_month
        description: First day of the issue month. Join key against the budget.
        data_tests:
          - not_null
      - name: status
        description: Invoice status in the source system.
      - name: expense_category_raw
        description: >
          Category as reported by the source. Null for roughly 15% of invoices;
          the classification agent fills these in downstream.
      - name: transaction_type
        description: invoice or credit_note, derived from the sign of the amount.
      - name: description
        description: Free text written by whoever submitted the invoice.
      - name: amount
        description: Amount in the original currency, signed.
        data_tests:
          - not_null
      - name: currency
        description: Currency the invoice was issued in.
        data_tests:
          - not_null
      - name: amount_usd
        description: >
          Amount converted to USD. Not null is enforced: a null would mean the
          invoice found no exchange rate, which must never pass silently.
        data_tests:
          - not_null
      - name: rate_to_usd
        description: Rate applied, kept so the conversion can be audited.
      - name: is_rate_filled
        description: True when the rate was carried forward from an earlier day.
