version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: vendors
        description: vendors information
      - name: cost_centers
        description: cost centers information
      - name: budget
        description: information for each budget  
      - name: invoices
        description: One row per invoice as exported by the ERP. Contains duplicates, missing categories and orphan cost center ids on purpose.
      - name: fx_rates
        description: rates for each currency
  - name: ml
    schema: ml
    tables:
      - name: invoice_category_predictions
        description: One row per prediction made by the classification agent. Keeps full history, so the most recent prediction per invoice is picked in staging.