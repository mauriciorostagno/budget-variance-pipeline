version: 2

models:
  - name: int_invoices_classified
    description: >
      Invoices with business logic applied: negative amounts are classified as
      credit notes, and cost center ids that are missing from the dimension are
      mapped to the Unknown member (-1). Grain is unchanged, one row per invoice.
    columns:
      - name: invoice_id
        description: identifier for each invoice.
        data_tests:
          - unique
          - not_null
      - name: vendor_id
        description: identifier for each vendor.
      - name: cost_center_id
        description: identifier for each cost center.
      - name: issue_date
        description: date when the invoice was made.
      - name: due_date
        description: Payment due date, normally 30 days after issue_date.
      - name: status
        description: statuses for the invoices.
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'approved', 'paid', 'rejected']
      - name: expense_category_raw
        description: >
          Category as reported by the source system. Null for roughly 15% of
          invoices, which is expected: the classification agent fills these in
          downstream. No not_null test here on purpose.
      - name: transaction_type
        description: classification of the transactions.
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_note', 'invoice']
      - name: description
        description: description for the invoice.
      - name: amount
        description: amount for the transaction.
      - name: currency
        description: currency of the transaction.
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'ARS', 'EUR']
      - name: updated_at
        description: date when the registry was modified for the last time.
      - name: cost_center_key
        description: >
          Cost center to use for joins and reporting. Falls back to -1 (the
          Unknown member of the dimension) when the source system sent an id
          that does not exist, which happens for about 1% of invoices.
        data_tests:
          - not_null
