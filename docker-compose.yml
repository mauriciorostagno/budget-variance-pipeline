services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: data_admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: finance_datawarehouse
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "data_admin"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-db-volume:/var/lib/pgadmin
    ports:
      - "5050:80"

volumes:
  postgres-db-volume:
  pgadmin-db-volume: